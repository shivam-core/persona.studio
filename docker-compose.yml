version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: persona-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
      POSTGRES_DB: persona
    ports:
      - "5432:5432"
    volumes:
      - persona_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: persona-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      ACCESS_MODE: local
      DATABASE_URL: postgresql+psycopg://persona:persona@db:5432/persona
      DATA_DIR: /data/persona
      APP_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://api:8000
      DEFAULT_CURRENCY: INR
      DEFAULT_TIMEZONE: Asia/Kolkata
      DEMO_SEED: 42
      WORKER_CONCURRENCY: 1
      LLM_PROVIDER: none
      SESSION_SECRET: docker-session-secret-change-if-needed-32chars
    ports:
      - "8000:8000"
    volumes:
      - persona_data:/data/persona
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: persona-worker
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.runner"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      APP_ENV: production
      ACCESS_MODE: local
      DATABASE_URL: postgresql+psycopg://persona:persona@db:5432/persona
      DATA_DIR: /data/persona
      DEFAULT_CURRENCY: INR
      DEFAULT_TIMEZONE: Asia/Kolkata
      DEMO_SEED: 42
      WORKER_CONCURRENCY: 1
      LLM_PROVIDER: none
    volumes:
      - persona_data:/data/persona

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: persona-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_CURRENCY: INR
    ports:
      - "3000:3000"

volumes:
  persona_pgdata:
  persona_data:
